[platformio]
default_envs = feather

[env:feather]
platform = espressif32
board = adafruit_feather_esp32s3                     ; #5477: 4MB flash, 2MB PSRAM
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1          ; send Serial over native USB
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit VS1053 Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit MAX1704X
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
build_src_filter = +<*> -<vs1053_probe.cpp>

; Wiring probe for the VS1053 (src/vs1053_probe.cpp); not part of the firmware
[env:probe]
extends = env:feather
build_src_filter = +<vs1053_probe.cpp>
lib_deps =

; Over-the-air upload to the firmware page; password comes from 1Password at upload time
[env:ota]
extends = env:feather
upload_protocol = custom
upload_port = 192.168.20.116                     ; override with --upload-port <ip>
upload_command = curl --fail --show-error -u admin:`op read op://Private/psqgkefivwk3tcrjjd3vm2ns5i/password` -F "firmware=@$SOURCE" http://$UPLOAD_PORT/update
